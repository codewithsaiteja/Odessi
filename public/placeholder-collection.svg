<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="editorialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0c0c0c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C578" />
      <stop offset="100%" stop-color="#B88A2D" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#editorialGrad)" />

  <!-- Outer Editorial Borders -->
  <rect x="24" y="24" width="752" height="952" fill="none" stroke="#262626" stroke-width="1" />
  <rect x="36" y="36" width="728" height="928" fill="none" stroke="#1c1c1c" stroke-width="1" />

  <!-- Center Editorial Emblem -->
  <g transform="translate(400, 470)" text-anchor="middle">
    <!-- Minimalist Layered Collection Panels -->
    <rect x="-70" y="-110" width="140" height="180" fill="none" stroke="#2a2a2a" stroke-width="1.5" />
    <rect x="-85" y="-95" width="140" height="180" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="0" cy="-5" r="4" fill="#D4AF37" />

    <!-- Corner Accents on Primary Frame -->
    <line x1="-95" y1="-95" x2="-75" y2="-95" stroke="#D4AF37" stroke-width="2" />
    <line x1="-95" y1="-95" x2="-95" y2="-75" stroke="#D4AF37" stroke-width="2" />
    <line x1="65" y1="95" x2="45" y2="95" stroke="#D4AF37" stroke-width="2" />
    <line x1="65" y1="95" x2="65" y2="75" stroke="#D4AF37" stroke-width="2" />

    <!-- Subtle Horizontal Rule -->
    <line x1="-140" y1="130" x2="140" y2="130" stroke="#262626" stroke-width="1" />

    <!-- Typography -->
    <text y="175" fill="#FAF9F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="4" text-transform="uppercase">
      ODISSI.TFI
    </text>
    <text y="202" fill="#D4AF37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="3" text-transform="uppercase">
      COLLECTION ARCHIVE
    </text>
    <text y="226" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" letter-spacing="1.5">
      COVER IMAGE COMING SOON
    </text>
  </g>
</svg>
