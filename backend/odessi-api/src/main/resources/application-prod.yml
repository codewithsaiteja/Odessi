spring:
  config:
    activate:
      on-profile: prod

app:
  # In production, the frontend is served from odessi.shop
  cors:
    allowed-origins: ${FRONTEND_URL:https://odessi.shop}
  
  # Ensure cookies are secure and use SameSite=None for cross-site cookie support (Vercel <-> Render)
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:None}

logging:
  level:
    root: INFO
    com.odessi.api: INFO
    org.springframework.web: INFO
    # Less noisy SQL logging for production
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  
  # Write logs to a file in the container so they can be persisted or rotated
  file:
    name: /tmp/app.log

# Sentry production environment configuration
sentry:
  environment: ${SENTRY_ENVIRONMENT:production}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

