spring:
  config:
    activate:
      on-profile: prod

app:
  # In production, the frontend is served from odessitfi.me (with apex, www, Vercel preview, and legacy odessi.shop)
  cors:
    allowed-origins: ${FRONTEND_URL:https://odessitfi.me,https://www.odessitfi.me,https://odessi-frontend.vercel.app,https://odessi.shop}
  
  # Ensure cookies are secure and use SameSite=None for cross-site cookie support (Vercel <-> Render)
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:None}

  # Production Email Configuration (Resend official SDK / SMTP fallback)
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    host: ${MAIL_HOST:${SMTP_HOST:}}
    port: ${MAIL_PORT:${SMTP_PORT:587}}
    username: ${MAIL_USERNAME:${SMTP_USERNAME:}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:}}
    from-email: ${MAIL_FROM:${EMAIL_FROM_ADDRESS:orders@odessitfi.me}}
    from-name: ${MAIL_FROM_NAME:${EMAIL_FROM_NAME:Odessi}}
    primary-frontend-url: ${PRIMARY_FRONTEND_URL:https://www.odessitfi.me}
  decart:
    api-key: ${DECART_API_KEY:}
    model: ${DECART_MODEL:lucy-vton-3.5}
    token-endpoint: ${DECART_TOKEN_ENDPOINT:https://api.decart.ai/v1/client/tokens}
    token-ttl-seconds: ${DECART_TOKEN_TTL_SECONDS:300}
    enabled: ${DECART_ENABLED:true}

logging:
  level:
    root: INFO
    com.odessi.api: INFO
    org.springframework.web: INFO
    # Less noisy SQL logging for production
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  
  # Write logs to a file in the container so they can be persisted or rotated
  file:
    name: /tmp/app.log

# Sentry production environment configuration
sentry:
  environment: ${SENTRY_ENVIRONMENT:production}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

