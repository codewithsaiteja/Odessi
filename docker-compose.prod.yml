services:
  postgres:
    image: postgres:15-alpine
    container_name: odessi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-odessi}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-odessi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - odessi_net

  backend:
    build:
      context: ./backend/odessi-api
      dockerfile: Dockerfile
    container_name: odessi_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-odessi}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    # Port 8080 is NOT exported to host, only available in odessi_net
    networks:
      - odessi_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odessi_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    # Port 3000 is NOT exported to host, only available in odessi_net
    networks:
      - odessi_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.7-alpine
    container_name: odessi_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - odessi_net

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  odessi_net:
    driver: bridge
